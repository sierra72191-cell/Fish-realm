<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Sandbox — Day 1</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;display:flex;align-items:center;justify-content:center}
.screen{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 1.5rem;position:relative;overflow:hidden;font-family:'Share Tech Mono',monospace;background:#000;}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(0,255,200,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,200,0.04) 1px,transparent 1px);background-size:40px 40px;}
.scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,200,0.025) 2px,rgba(0,255,200,0.025) 4px);pointer-events:none;z-index:1;}
.top-bar,.bottom-bar{position:absolute;left:0;right:0;height:6px;background:linear-gradient(90deg,#00ffcc,#0ff,#00ffcc);box-shadow:0 0 18px #00ffcc;}
.top-bar{top:0}.bottom-bar{bottom:0}
.content{position:relative;z-index:2;text-align:center;width:100%;max-width:600px}
.title-main{font-family:'Orbitron',monospace;font-size:clamp(2.2rem,9vw,4rem);color:#00ffcc;text-shadow:0 0 20px #00ffcc,0 0 50px #00ffcc66;letter-spacing:0.05em;line-height:1.1;}
.day-label{font-family:'Orbitron',monospace;font-size:clamp(3rem,12vw,6rem);color:#ff1aff;text-shadow:0 0 28px #ff1aff,0 0 60px #ff1aff55;margin:0.4rem 0 0;line-height:1;}
.tagline{margin-top:1.8rem;font-size:clamp(0.85rem,3.5vw,1.1rem);color:#00ffcc;line-height:2;text-shadow:0 0 10px #00ffcc66;}
.sig{margin-top:2rem;font-size:clamp(0.65rem,2.5vw,0.85rem);color:#00ffcc66;letter-spacing:0.1em;border-top:1px solid #00ffcc22;padding-top:1rem;}
.sig span{color:#ff1aff;}
.badge{display:inline-block;margin-top:0.6rem;padding:4px 14px;border:1px solid #ff1aff55;color:#ff1aff99;font-size:0.7rem;letter-spacing:0.12em;border-radius:2px;}
</style>
</head>
<body>
<div class="screen">
<div class="grid-bg"></div><div class="scanlines"></div>
<div class="top-bar"></div>
<div class="content">
<div class="title-main">CLAUDE<br>SANDBOX</div>
<div class="day-label">DAY 1</div>
<div class="tagline">The journey begins.<br>Building in the open.<br>Forward we gooo! 🚀</div>
<div class="sig">Powered by <span>Claude Sonnet 4.6</span> · sierra72191-cell<br><span class="badge">COMMIT #001 — 2026-06-15</span></div>
</div>
<div class="bottom-bar"></div>
</div>
</body>
</html>
